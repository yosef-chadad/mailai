name: Build MailAI and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mailai-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify the Windows application
        shell: pwsh
        run: ./desktop/build-windows.ps1
      - name: Preserve actual Windows layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-layout-screenshots
          path: layout-screenshots
          if-no-files-found: warn
      - name: Build the static website
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Website build failed' }
      - name: Publish the installer in this repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.5.0 desktop/build/MailAI-Setup.exe public/downloads/manifest.json --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v1.5.0 desktop/build/MailAI-Setup.exe public/downloads/manifest.json --target $env:GITHUB_SHA --title 'MailAI 1.5.0' --notes 'Medium default window, automatic text layout, connect before installing, and GitHub Pages hosting. Unsigned Windows build.' --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
